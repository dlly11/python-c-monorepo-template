[project]
name = "python-c-monorepo-template"
version = "3.0.1"
description = "Production-oriented template for Python and C projects in one monorepo."
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false
required-version = ">=0.10.9"
# One backend version for editable installs, distribution checks, and release builds.
build-constraint-dependencies = ["setuptools==84.0.0"]

[tool.uv.workspace]
members = [
  "python/packages/*",
  "python/apps/*",
]

[tool.uv.sources]
monorepo-repo-tools = { path = "tools/repo_tools", editable = true }
monorepo-template-creator = { workspace = true }
example-core = { workspace = true }
example-package-a = { workspace = true }
example-package-b = { workspace = true }
example-package-a-cli = { workspace = true }

[dependency-groups]
creator-build = ["pyinstaller==6.22.3"]
test = [
  "pytest>=8.4",
  "pytest-cov>=6.2",
]
lint = [
  "clang-format==23.1.1",
  # BEGIN TEMPLATE CREATOR ONLY
  # Type-check the creator's custom backend outside its isolated build environment.
  "setuptools>=77",
  # END TEMPLATE CREATOR ONLY
  "pre-commit>=4.2",
  "ruff>=0.16.1",
  "ty>=0.0.80",
]
dev = [
  "monorepo-repo-tools[commit]",
  { include-group = "lint" },
  { include-group = "test" },
]
docs = [
  "breathe>=4.36,<5",
  "furo>=2025.7.19",
  "myst-parser>=5.0,<6",
  "sphinx>=9.1,<10",
  "sphinxcontrib-mermaid>=2.0,<3",
]
coverage = [
  { include-group = "test" },
  "gcovr>=8.6,<9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.repo-tools.conventional-commits]
shared-scopes = ["repo", "ci", "build", "docs", "deps", "release", "repo-tools"]

[tool.commitizen]
name = "cz_repo_tools"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # import sorting
  "UP",  # Python upgrades
  "B",   # bugbear
  "SIM", # simplifications
  "RUF", # Ruff-specific checks
  "S",   # common security issues
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"tools/repo_tools/**" = ["S603", "S607"]
"python/apps/template_creator/**" = ["S603", "S607"]
"tools/creator/**" = ["S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = [
  "repo_tools",
  "template_creator",
  "example_core",
  "example_package_a",
  "example_package_a_cli",
  "example_package_b",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["python", "tools/repo_tools/tests"]
addopts = "--import-mode=importlib --strict-config --strict-markers --cov --cov-report=term-missing"
xfail_strict = true

[tool.coverage.run]
branch = true
source = [
  "template_creator",
  "example_core",
  "example_package_a",
  "example_package_b",
  "example_package_a_cli",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = [
  'if __name__ == "__main__":',
  "raise NotImplementedError",
]
