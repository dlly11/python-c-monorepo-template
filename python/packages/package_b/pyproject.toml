[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "example-package-b"
version = "0.4.1"
description = "Example Python Package B built independently on example-core."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["example-core>=0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
example_package_b = ["py.typed"]
