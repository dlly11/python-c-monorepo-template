[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "monorepo-repo-tools"
version = "0.1.0"
description = "Private maintenance commands for this repository."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
classifiers = ["Private :: Do Not Upload"]

[project.optional-dependencies]
commit = ["commitizen>=4.18,<5"]

[project.entry-points."commitizen.plugin"]
cz_repo_tools = "repo_tools.commitizen_adapter:RepositoryCz"

[project.scripts]
repo-tools = "repo_tools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repo_tools = ["py.typed"]
