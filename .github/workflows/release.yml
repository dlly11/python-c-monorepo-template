name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      recovery-run-id:
        description: Successful fresh manual CI run on current main (only for evidence recovery)
        required: false
        type: string

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Create GitHub release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
      issues: write
      # Release Please comments on the merged PR after creating its release.
      pull-requests: write
    outputs:
      ready: ${{ steps.readiness.outputs.ready }}
      tooling-sha: ${{ steps.assets.outputs.tooling-sha }}
      releases: ${{ steps.assets.outputs.releases }}
      python: ${{ steps.assets.outputs.python }}
      native: ${{ steps.assets.outputs.native }}
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Check out release gate from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Require successful merged PR verification for current main
        id: readiness
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/repo_tools/run.py check-release-readiness
      - name: Validate release automation configuration
        if: steps.readiness.outputs.ready == 'true'
        id: automation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_AUTH_MODE: ${{ vars.RELEASE_AUTH_MODE }}
          RELEASE_AUTO_MERGE: ${{ vars.RELEASE_AUTO_MERGE }}
          RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: python tools/repo_tools/run.py check-release-automation
      - name: Create repository-scoped release App token
        if: steps.automation.outputs.auth-mode == 'app'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Run Release Please
        if: steps.readiness.outputs.ready == 'true'
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: &release-token ${{ (steps.automation.outputs.auth-mode == 'app' && steps.app-token.outputs.token) || (steps.automation.outputs.auth-mode == 'pat' && secrets.RELEASE_PAT) || (steps.automation.outputs.auth-mode == 'github-token' && github.token) }}
          target-branch: main
          config-file: tools/release-please/config.json
          manifest-file: tools/release-please/manifest.json
          skip-github-pull-request: true

      - name: Plan component assets
        if: steps.readiness.outputs.ready == 'true'
        id: assets
        env:
          RELEASE_OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        run: python tools/repo_tools/run.py release-assets plan

      # BEGIN TEMPLATE CREATOR ONLY
      - name: Keep the template release as the main download
        if: steps.release.outputs.releases_created == 'true'
        env:
          GH_TOKEN: *release-token
        run: |
          # Component releases must not replace the creator's stable download landing page.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' > /tmp/release-tags.txt
          python - <<'PYCODE'
          import re
          import subprocess
          from pathlib import Path

          tags = Path('/tmp/release-tags.txt').read_text().splitlines()
          tag = next(tag for tag in tags if re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag))
          subprocess.run(['gh', 'release', 'edit', tag, '--latest'], check=True)
          PYCODE
      # END TEMPLATE CREATOR ONLY

      - name: Summarize release creation
        if: always()
        continue-on-error: true
        env:
          STAGE_STATUS: ${{ job.status }}
          RELEASES: ${{ steps.assets.outputs.releases }}
        run: |
          python - <<'PY'
          import os
          import json
          from html import escape
          from pathlib import Path
          from urllib.parse import quote

          repository = os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY']
          lines = ['## Release creation', '', 'Outcome: ' + escape(os.environ['STAGE_STATUS']), '']
          releases = json.loads(os.environ.get('RELEASES') or '[]')
          for release in releases:
              tag = release['tag']
              url = repository + '/releases/tag/' + quote(tag, safe='')
              lines += [f'- <a href="{escape(url, quote=True)}">{escape(tag)}</a>']
          lines += ['', 'Asset uploads run separately; creation does not confirm their completion.'
                    if releases else 'No new release was reported by this job.']
          guide = repository + '/blob/main/docs/releases.md#release-recovery'
          lines += ['', f'<a href="{escape(guide, quote=True)}">Choose the recovery procedure</a>.']
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as stream:
              stream.write('\n'.join(lines) + '\n')
          PY

  prepare-release-pr:
    name: Prepare release PR
    needs: release-please
    if: needs.release-please.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out release gate from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Require successful merged PR verification for current main
        id: readiness
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/repo_tools/run.py check-release-readiness
      - name: Validate release automation configuration
        if: steps.readiness.outputs.ready == 'true'
        id: automation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_AUTH_MODE: ${{ vars.RELEASE_AUTH_MODE }}
          RELEASE_AUTO_MERGE: ${{ vars.RELEASE_AUTO_MERGE }}
          RELEASE_APP_CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: python tools/repo_tools/run.py check-release-automation
      - name: Create repository-scoped release App token
        if: steps.automation.outputs.auth-mode == 'app'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Open or update release PR
        if: steps.readiness.outputs.ready == 'true'
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: *release-token
          target-branch: main
          config-file: tools/release-please/config.json
          manifest-file: tools/release-please/manifest.json
          skip-github-release: true

      - name: Detect unpublished merged release PRs
        if: steps.readiness.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/repo_tools/run.py check-release-automation --check-pending

      # Release Please updates the declared versions, but uv.lock is generated by uv. Refresh the
      # lockfile on the managed release branch, then dispatch authoritative CI in every
      # credential mode. Automatic release PR CI delegates to that synchronized run.
      - name: Read the release pull request
        if: steps.release.outputs.prs_created == 'true'
        id: release-pr
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          echo "branch=$(jq -r '.headBranchName' <<< "${RELEASE_PR}")" >> "${GITHUB_OUTPUT}"
          echo "number=$(jq -r '.number' <<< "${RELEASE_PR}")" >> "${GITHUB_OUTPUT}"

      - name: Check out the release pull request
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ steps.release-pr.outputs.branch }}
          token: *release-token

      - name: Install uv
        if: steps.release.outputs.prs_created == 'true'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Refresh and verify the workspace lockfile
        if: steps.release.outputs.prs_created == 'true'
        run: |
          uv lock
          python tools/repo_tools/run.py check-versions

      - name: Commit the refreshed lockfile
        if: steps.release.outputs.prs_created == 'true'
        id: release-head
        env:
          RELEASE_BRANCH: ${{ steps.release-pr.outputs.branch }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uv.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: synchronize release lockfile"
            git push origin "HEAD:${RELEASE_BRANCH}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Dispatch authoritative release PR validation
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ steps.release-pr.outputs.branch }}
          RELEASE_PR_NUMBER: ${{ steps.release-pr.outputs.number }}
          RELEASE_HEAD: ${{ steps.release-head.outputs.sha }}
        run: |
          gh workflow run ci.yml --ref "${RELEASE_BRANCH}" -f "release-pr-number=${RELEASE_PR_NUMBER}" -f "expected-head=${RELEASE_HEAD}"
          gh workflow run pr-title.yml --ref "${RELEASE_BRANCH}" -f "pr-number=${RELEASE_PR_NUMBER}"

      - name: Validate the synchronized release PR for auto-merge
        if: steps.release.outputs.prs_created == 'true' && steps.automation.outputs.auto-merge == 'true'
        id: merge-eligibility
        env:
          GH_TOKEN: *release-token
          RELEASE_BRANCH: ${{ steps.release-pr.outputs.branch }}
          RELEASE_PR_NUMBER: ${{ steps.release-pr.outputs.number }}
          RELEASE_HEAD: ${{ steps.release-head.outputs.sha }}
        run: >-
          python tools/repo_tools/run.py check-release-automation
          --pr "${RELEASE_PR_NUMBER}" --branch "${RELEASE_BRANCH}" --expected-head "${RELEASE_HEAD}"

      - name: Enable release PR auto-merge after required checks and reviews
        if: steps.release.outputs.prs_created == 'true' && steps.automation.outputs.auto-merge == 'true'
        env:
          GH_TOKEN: *release-token
          RELEASE_PR_NUMBER: ${{ steps.release-pr.outputs.number }}
          RELEASE_HEAD: ${{ steps.release-head.outputs.sha }}
          RELEASE_TITLE: ${{ steps.merge-eligibility.outputs.title }}
        run: >-
          gh pr merge "${RELEASE_PR_NUMBER}" --repo "${GITHUB_REPOSITORY}"
          --auto --squash --match-head-commit "${RELEASE_HEAD}" --subject "${RELEASE_TITLE}"

      - name: Summarize release PR preparation
        if: always()
        continue-on-error: true
        env:
          STAGE_STATUS: ${{ job.status }}
          RELEASE_PR_NUMBER: ${{ steps.release-pr.outputs.number }}
        run: |
          python - <<'PY'
          import os
          from html import escape
          from pathlib import Path

          repository = os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY']
          lines = ['## Release PR preparation', '', 'Outcome: ' + escape(os.environ['STAGE_STATUS']), '']
          number = os.environ.get('RELEASE_PR_NUMBER', '')
          if number.isascii() and number.isdigit():
              url = repository + '/pull/' + number
              lines += [f'Release PR: <a href="{escape(url, quote=True)}">#{number}</a>.']
          else:
              lines += ['No release PR number was reported by this job.']
          lines += ['', 'A preparation failure does not block assets for an already-created release.']
          guide = repository + '/blob/main/docs/releases.md#release-recovery'
          lines += ['', f'<a href="{escape(guide, quote=True)}">Choose the recovery procedure</a>.']
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as stream:
              stream.write('\n'.join(lines) + '\n')
          PY

  python-assets:
    name: Publish Python assets
    if: needs.release-please.outputs.python == 'true'
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tooling-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Build, check, and upload released Python distributions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES: ${{ needs.release-please.outputs.releases }}
        run: python tools/repo_tools/run.py release-assets python

  native-assets:
    name: Publish native asset (${{ matrix.os }})
    if: needs.release-please.outputs.native == 'true'
    needs: release-please
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - {os: ubuntu-latest, cc: gcc, cxx: g++}
          - {os: macos-latest, cc: clang, cxx: clang++}
          - {os: windows-latest, cc: gcc, cxx: g++}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tooling-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build, check, and upload released native components
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES: ${{ needs.release-please.outputs.releases }}
        run: python tools/repo_tools/run.py release-assets native

  # BEGIN TEMPLATE CREATOR ONLY
  creator-assets:
    name: Publish repository creator (${{ matrix.target }})
    if: needs.release-please.outputs.release-created == 'true'
    needs: release-please
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, target: linux-x64}
          - {os: ubuntu-22.04-arm, target: linux-arm64}
          - {os: windows-2022, target: windows-x64}
          - {os: windows-11-arm, target: windows-arm64}
          - {os: macos-15-intel, target: macos-x64}
          - {os: macos-14, target: macos-arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag-name }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
      - run: uv sync --locked --all-packages --group creator-build
      - run: uv run --no-sync python tools/creator/build.py --target ${{ matrix.target }}
      - name: Upload tested creator archive and checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag-name }}
        run: gh release upload "${RELEASE_TAG}" dist/creator/* --clobber
  # END TEMPLATE CREATOR ONLY
