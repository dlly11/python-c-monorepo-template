name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conventional-pr-title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python scripts/check_pr_title.py "${PR_TITLE}"

  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run python scripts/check_python.py
      - run: uv run python scripts/check_versions.py
      - run: uv build --all-packages

  python-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-packages
      - run: uv run pytest

  native-build:
    name: Native build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: cmake --preset dev
      - run: cmake --build --preset dev
      - run: ctest --preset dev

  native-analysis:
    name: Native static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install native analysis tools
        run: sudo apt-get update && sudo apt-get install --yes clang-format clang-tidy cppcheck ninja-build
      - run: cmake --preset analysis
      - run: cmake --build --preset analysis
      - run: cmake --build --preset analysis --target format-c-check
      - run: ctest --preset analysis

  sanitizers:
    name: Native sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: cmake --preset asan
      - run: cmake --build --preset asan
      - run: ctest --preset asan
