name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  merged-pr:
    name: Merged PR verification
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify merged contents against successful PR CI
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_BASE: ${{ github.event.before }}
          COMMIT_HEAD: ${{ github.sha }}
        run: python scripts/check_merge.py --base "${COMMIT_BASE}" --head "${COMMIT_HEAD}"
      - run: python scripts/check_versions.py

  python-quality:
    name: Python quality
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate new commit subjects
        env:
          COMMIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || format('origin/{0}', github.event.repository.default_branch) }}
          COMMIT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/check_commits.py --base "${COMMIT_BASE}" --head "${COMMIT_HEAD}"
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run python scripts/check_workspace.py
      - run: uv run python scripts/check_python.py
      - run: uv run python scripts/check_versions.py
      - run: uv run python scripts/check_python_install.py
      - name: Record tested PR contents
        run: python scripts/check_merge.py --record build/pr-validation/validation.json
      - uses: actions/upload-artifact@v7
        with:
          name: pr-validation
          path: build/pr-validation/validation.json
          if-no-files-found: error
          overwrite: true

  python-tests:
    name: Python ${{ matrix.python-version }}
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-packages
      - run: uv run pytest --no-cov

  coverage:
    name: Coverage
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked --all-packages --group coverage
      - run: uv run --group coverage python scripts/check_coverage.py
      - name: Publish coverage summary
        if: always() && hashFiles('build/coverage/reports/summary.md') != ''
        run: cat build/coverage/reports/summary.md >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: build/coverage/reports
          if-no-files-found: warn
          retention-days: 14

  documentation:
    if: github.event_name != 'push'
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install --yes doxygen
      - run: uv sync --locked --all-packages --group docs
      - run: uv run --group docs python scripts/build_docs.py

  native-build:
    name: Native build (${{ matrix.os }})
    if: github.event_name != 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
          - os: macos-latest
            cc: clang
            cxx: clang++
          - os: windows-latest
            cc: gcc
            cxx: g++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: cmake --preset dev
      - run: cmake --build --preset dev
      - run: ctest --preset dev
      - name: Verify the native install tree
        run: |
          cmake --install build/dev --prefix build/dev/stage
          python scripts/check_native_install.py build/dev/stage
          cmake -S native/tests/install_consumer -B build/install-consumer -G Ninja -DCMAKE_PREFIX_PATH="${{ github.workspace }}/build/dev/stage"
          cmake --build build/install-consumer
          ctest --test-dir build/install-consumer --output-on-failure

  native-analysis:
    name: Native static analysis
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install native analysis tools
        run: sudo apt-get update && sudo apt-get install --yes clang-format clang-tidy cppcheck ninja-build
      - run: cmake --preset analysis
      - run: cmake --build --preset analysis
      - run: cmake --build --preset analysis --target format-c-check
      - run: ctest --preset analysis

  sanitizers:
    name: Native sanitizers
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: cmake --preset asan
      - run: cmake --build --preset asan
      - run: ctest --preset asan
