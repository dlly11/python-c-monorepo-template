version: 2
updates:
  - package-ecosystem: uv
    directory: /
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: weekly
    groups:
      python-development:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: weekly
